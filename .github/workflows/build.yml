name: Build

on:
  push:
    branches: [ "1.21" ]
  pull_request:
    branches: [ "1.21" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout Nuclear-Radiation dependency
        uses: actions/checkout@v7
        with:
          repository: igentuman/Nuclear-Radiation
          ref: 1.21.1
          path: NuclearRadiation

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build
      - name: Archive build
        uses: actions/upload-artifact@v4
        with:
          name: Mod JARs
          path: build/libs