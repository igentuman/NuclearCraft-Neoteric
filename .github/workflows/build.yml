name: Build

on:
  push:
    branches: [ "26.1.2" ]
  pull_request:
    branches: [ "26.1.2" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout Nuclear-Radiation dependency
        uses: actions/checkout@v7
        with:
          repository: igentuman/Nuclear-Radiation
          ref: 26.1.2
          path: Nuclear-Radiation-26.1

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify porting environment
        run: ./gradlew preparePortingEnvironment -PradiationProjectDir=Nuclear-Radiation-26.1

      - name: Build with Gradle
        run: ./gradlew build -PradiationProjectDir=Nuclear-Radiation-26.1
      - name: Archive build
        uses: actions/upload-artifact@v4
        with:
          name: Mod JARs
          path: build/libs
