plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}


tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel") // BlockBench project files
    exclude("**/.cache/**") // datagen cache files
}

repositories {
    mavenLocal()
    maven {
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url = "https://maven.k-4u.nl"
    }
    maven {
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        url = 'https://jitpack.io'
        content {
            includeGroup "com.github.rtyley"
        }
    }
    maven {
        url = "https://maven.squiddev.cc"
        content {
            includeGroup("cc.tweaked")
        }
    }
    maven {
        url = "https://modmaven.dev/"
    }
    maven { url = "https://maven.createmod.net" }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

base {
    archivesName = "NuclearCraft-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

def devProfile = providers.gradleProperty('devProfile').getOrElse('core')
if (!(devProfile in ['core', 'integrations', 'full'])) {
    throw new GradleException("Unknown devProfile '${devProfile}'; use core, integrations or full.")
}
def withEmi = providers.gradleProperty('withEmi').map { it.toBoolean() }.getOrElse(false)

configurations {
    integrationMods {
        canBeResolved = false
        canBeConsumed = false
    }
    developmentMods {
        canBeResolved = false
        canBeConsumed = false
    }
    emiMods {
        canBeResolved = false
        canBeConsumed = false
    }
    compileOnly.extendsFrom integrationMods
    testCompileOnly.extendsFrom integrationMods
    if (devProfile != 'core') {
        runtimeOnly.extendsFrom integrationMods
    }
    if (devProfile == 'full') {
        runtimeOnly.extendsFrom developmentMods
    }
    if (withEmi) {
        runtimeOnly.extendsFrom emiMods
    }
}

sourceSets {
    test {
        if (devProfile == 'core') {
            java.exclude 'igentuman/nc/compat/**'
        }
    }
    datagen {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

sourceSets.main.java {
    exclude 'igentuman/nc/compat/create/**'
    exclude 'igentuman/nc/compat/ie/**'
    exclude 'igentuman/nc/compat/tis3d/**'
}

configurations {
    datagenImplementation.extendsFrom implementation
    datagenCompileOnly.extendsFrom compileOnly
    datagenRuntimeOnly.extendsFrom runtimeOnly
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
    datagenRuntimeClasspath {
        exclude group: 'curse.maven', module: 'applied-energistics-2-223794'
        exclude group: 'curse.maven', module: 'create-328085'
        exclude group: 'curse.maven', module: 'tis-3d-238603'
        exclude group: 'curse.maven', module: 'ex-deorum-901420'
    }
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo(sourceSets.datagen)
    addModdingDependenciesTo(sourceSets.gametest)
    addModdingDependenciesTo(sourceSets.test)

    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        nc_gametest {
            sourceSet(sourceSets.gametest)
        }
    }

    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            loadedMods = [mods."${mod_id}", mods.nc_gametest]
            systemProperty 'neoforge.enabledGameTestNamespaces', 'nc_gametest'
            programArguments.addAll '--tests', 'nc_gametest:*', '--report', 'gametest.xml'
        }

        data {
            clientData()
            sourceSet = sourceSets.datagen

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            loadedMods.convention([mods."${mod_id}"])
            gameDirectory = layout.projectDirectory.dir("run/${name}")
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
}

dependencies {
    compileOnly "org.jetbrains:annotations:${jetbrains_annotations_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'

    // Required in every profile. Explicit substitution is configured in settings.gradle.
    implementation("maven.modrinth:nuclear-radiation:${radiation_version}") { transitive = false }

    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cct_version}"
    integrationMods "cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cct_version}"
    integrationMods "curse.maven:opencomputers-ii-modern-1657848:9291036"
    implementation "curse.maven:jei-238222:9384706"
    implementation "curse.maven:kubejs-238086:9396057"
    implementation "curse.maven:rhino-416294:8463898"
    implementation "curse.maven:applied-energistics-2-223794:9022271"
    implementation "curse.maven:guideme-1173950:9366331"
    implementation "curse.maven:curios-309927:8463519"
    implementation "curse.maven:the-one-probe-245211:8797594"
    implementation "curse.maven:multi-builder-tool-827020:8502117"
    implementation "curse.maven:patchouli-306770:8404543"
    implementation "curse.maven:ex-deorum-901420:8096345"
    integrationMods "curse.maven:refined-storage-243076:8211383"

    def emi = "curse.maven:pf-emi-1654612:9587229"
    compileOnly emi
    emiMods emi

    def ponder = "net.createmod.ponder:ponder-neoforge:1.0.52+mc26.1.2"
    implementation ponder
    jarJar ponder
    jarJar "net.createmod.catnip:catnip-neoforge:1.0.52+mc26.1.2"
    jarJar "dev.engine-room.flywheel:flywheel-neoforge:1.0.6-mc26.1-7"

    def iris = "curse.maven:irisshaders-455508:8868960"
    def sodium = "curse.maven:sodium-394468:8859590"
    compileOnly iris
    compileOnly sodium
    developmentMods iris
    developmentMods sodium
    implementation "curse.maven:spark-361579:8918574"
    implementation "curse.maven:better-advanced-tooltips-1637623:9148547"
    implementation "curse.maven:architectury-api-419699:9651460"
    implementation "curse.maven:ftb-teams-forge-404468:9405340"
    implementation "curse.maven:ftb-quests-forge-289412:9456215"
    implementation "curse.maven:ftb-library-forge-404465:9456005"

}

def portingClasspaths = files(configurations.compileClasspath, configurations.runtimeClasspath,
        configurations.datagenRuntimeClasspath, configurations.testCompileClasspath,
        configurations.testRuntimeClasspath)
def portingJava = javaToolchains.launcherFor(java.toolchain)
tasks.register('preparePortingEnvironment') {
    group = 'build setup'
    description = 'Resolves the porting toolchain and dependency artifacts, and expands mod metadata.'
    dependsOn tasks.named('processResources')
    inputs.files(portingClasspaths)
    inputs.property('devProfile', devProfile)
    doLast {
        logger.lifecycle("Porting profile: ${devProfile}")
        logger.lifecycle("Java toolchain: ${portingJava.get().metadata.installationPath}")
        logger.lifecycle("Resolved ${portingClasspaths.files.size()} classpath artifacts")
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            radiation_version_range: radiation_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = layout.projectDirectory.dir('repo').asFile.toURI()
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
