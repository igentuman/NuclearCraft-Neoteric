jar {
    manifest {
        attributes([
                "Specification-Title"     : "nuclearcraft",
                "Specification-Vendor"    : "nuclearcraftsareus",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "nuclearcraftsareus",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

mixin {
    add sourceSets.main, "nuclearcraft.refmap.json"
}

jar.enabled = false

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs.addAll(['-Xlint:-deprecation', '-Xlint:-removal'])
}

configurations {
    shaded {
        transitive = false
    }
}

test {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            'version': version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

shadowJar {
    finalizedBy 'reobfShadowJar'

    from sourceSets.main.output.classesDirs
    from sourceSets.main.output.resourcesDir

    manifest {
        attributes([
                "Specification-Title"   : "NuclearCraft",
                "Specification-Vendor"  : "igentuman",
                "Specification-Version" : "${project.version}",
                "Implementation-Title"  : "${project.name}",
                "Implementation-Version": "${version}",
                "Implementation-Vendor" : "igentuman",
                "MixinConfigs"          : "nuclearcraft.mixins.json",
                "MixinConnector"        : "igentuman.nc.mixin.NuclearCraftMixinConnector"
        ])
    }

    configurations = [project.configurations.shaded]
    archiveClassifier = null
}



reobf {
    shadowJar {}
}

afterEvaluate {
    tasks.reobfJar.enabled = false
}

tasks.named('jarJar') {
    it.archiveClassifier.set("");
    dependsOn('reobfShadowJar')
}

tasks.matching { it.name == 'reobfJarJar' }.configureEach {
    dependsOn('jarJar')
}

tasks.assemble.dependsOn reobfShadowJar