plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.gradle.userdev' version '7.1.20'
}

version = "${mod_version}"
group = 'igentuman.nc'
base {
    archivesName = "NuclearCraft-${mc_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

minecraft {
    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', "${mod_id}"
        programArguments.addAll '--width', '1920', '--height', '1080'
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', "${mod_id}"
        programArgument '--nogui'
    }

    data {
        programArguments.addAll '--mod', "${mod_id}", '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets {
    main {
        java {
            // TODO: Compat modules excluded — waiting on these mods to port to NeoForge 1.21.1. Remove exclusions when available.
            exclude 'igentuman/nc/compat/oc2/**'           // Open Computers 2
            exclude 'igentuman/nc/compat/tis3d/**'         // TIS-3D
            exclude 'igentuman/nc/compat/kubejs/**'        // KubeJS
            exclude 'igentuman/nc/compat/refined_storage/**' // Refined Storage
            // AE2 compat re-enabled — AE2 19.x available for NeoForge 1.21.1
            exclude 'igentuman/nc/mixin/KubeJSRecipesEventJSMixin.java' // KubeJS mixin
        }
        resources { srcDir 'src/generated/resources' }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenLocal()
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "TOP"
        url = "https://maven.k-4u.nl"
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "SquidDev"
        url = "https://maven.squiddev.cc"
        content {
            includeGroup("cc.tweaked")
        }
    }
    maven { url = "https://jitpack.io" }
    maven { url = "https://modmaven.dev/" }
    maven { url = "https://maven.architectury.dev" }
    maven { url = "https://maven.saps.dev/minecraft" }
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
    maven {
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // JEI
    compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // JEI runtime disabled — EMI bridges JEI recipes; running both causes duplicate recipe warnings
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // EMI
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    localRuntime "dev.emi:emi-neoforge:${emi_version}"

    // The One Probe
    compileOnly("mcjty.theoneprobe:theoneprobe:${top_version}:api") { transitive = false }
    localRuntime("mcjty.theoneprobe:theoneprobe:${top_version}") { transitive = false }

    // CC:Tweaked (uses -forge naming for NeoForge 1.21.1)
    compileOnly("cc.tweaked:cc-tweaked-${mc_version}-core-api:${cc_version}")
    compileOnly("cc.tweaked:cc-tweaked-${mc_version}-forge-api:${cc_version}")
    localRuntime("cc.tweaked:cc-tweaked-${mc_version}-forge:${cc_version}")

    // Mekanism
    implementation "mekanism:Mekanism:${mc_version}-${mekanism_version}"
    implementation "mekanism:Mekanism:${mc_version}-${mekanism_version}:generators"

    // Applied Energistics 2
    compileOnly("org.appliedenergistics:appliedenergistics2:${ae2_version}") { transitive = false }
    localRuntime "org.appliedenergistics:appliedenergistics2:${ae2_version}"

    // GregTech CEu Modern
    compileOnly("com.gregtechceu.gtceu:gtceu-${mc_version}:${gtm_version}") { transitive = false }

    // KubeJS
    compileOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") { transitive = false }
    compileOnly("dev.latvian.mods:rhino:${rhino_version}") { transitive = false }

    // Architectury
    implementation "dev.architectury:architectury-neoforge:${architectury_version}"

    // Patchouli
    compileOnly "vazkii.patchouli:Patchouli:${mc_version}-${patchouli_version}:api"
    localRuntime "vazkii.patchouli:Patchouli:${mc_version}-${patchouli_version}"

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'

    // ---- DEFERRED: These mods have no NeoForge 1.21.1 port ----
    // Thermal Foundation, Thermal Expansion, CoFH Core
    // OC2 / Sedna / MarkdownManual
    // TIS-3D
    // Masterful Machinery, Large Ore Deposits, ForgeEnderTech, Cyclic, FLib
    // Refined Storage, Immersive Engineering, The Lost Cities
    // Construction Wand, Spark
    // FTB Library/Teams/Chunks, CTM
    // Better Fusion Reactor for Mekanism
    // Multi Builder Tool, AE2 (check availability)
}

test {
    useJUnitPlatform()
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            mc_version        : mc_version,
            mc_version_range  : mc_version_range,
            neo_version       : neo_version,
            neo_version_range : neo_version_range,
            loader_version_range : loader_version_range,
            mod_id            : mod_id,
            mod_version       : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '5000']
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "nuclearcraft",
                "Specification-Vendor"    : "nuclearcraftsareus",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "nuclearcraftsareus",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
