modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
issueTrackerURL="https://github.com/igentuman/NuclearCraft-Neoteric/issues"
authors="igentuman"
description='''
A complex nuclear engineering mod for Minecraft
'''
[[mixins]]
config="${mod_id}.mixins.json"
[[mixins]]
config="${mod_id}.catnip.mixins.json"
requiredMods=["catnip"]
#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="nuclear_radiation"
    type="required"
    versionRange="${radiation_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="curios"
    type="optional"
    versionRange="[15.0.0,)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="kubejs"
    type="optional"
    versionRange="[26.1.2-8.0.8,)"
    ordering="BEFORE"
    side="BOTH"
