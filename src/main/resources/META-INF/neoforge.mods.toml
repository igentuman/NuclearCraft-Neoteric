modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
issueTrackerURL="https://github.com/igentuman/NuclearCraft-Neoteric/issues"
authors="igentuman"
description='''
A complex nuclear engineering mod for Minecraft
'''
[[mixins]]
config="${mod_id}.mixins.json"
#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"
[[dependencies.${mod_id}]] #optional
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="nuclear_radiation"
    type="required"
    versionRange="[1.0.2,)"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="curios"
    type="optional"
    versionRange="[9.0,)"
    ordering="AFTER"
    side="BOTH"